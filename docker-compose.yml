services:
  postgres:
    image: postgres:16-alpine
    container_name: ftm_postgres
    environment:
      POSTGRES_DB: ftm_it_property_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/items_data.sql:/docker-entrypoint-initdb.d/02-items_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ftm_it_property_records"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ftm_php
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_SERVER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ftm_it_property_records
      DB_PORT: 5432
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}

volumes:
  postgres_data:
