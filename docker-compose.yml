services:
  postgres:
    image: postgres:16-alpine
    container_name: ftm_postgres
    environment:
      POSTGRES_DB: ftm_it_property_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./items_data.sql:/docker-entrypoint-initdb.d/02-items_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ftm_it_property_records"]
      interval: 10s
      timeout: 5s
      retries: 5

  apps-postgres:
    image: postgres:15
    container_name: ftm_apps_postgres
    environment:
      POSTGRES_DB: applications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - applications_db_data:/var/lib/postgresql/data
      - ./handover_init.sql:/docker-entrypoint-initdb.d/handover_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d applications_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build: .
    container_name: ftm_php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      apps-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_SERVER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ftm_it_property_records
      DB_PORT: 5432
      APP_DB_HOST: apps-postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: applications_db
      APP_DB_USER: postgres
      APP_DB_PASS: ${APP_DB_PASS:?Set APP_DB_PASS in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}

volumes:
  postgres_data:
  applications_db_data:
    external: true
